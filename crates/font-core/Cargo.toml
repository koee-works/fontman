[package]
name = "font-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true

# Font parsing. Pinned deliberately: ttf-parser's API shifts between minor
# versions (notably `variation_axes` / `tables().fvar`). If you bump this,
# re-check parse.rs.
ttf-parser = "0.25"

# Scanning + hashing
walkdir = "2"
rayon = "1"
blake3 = "1"

# Google Fonts. Blocking client: every network call already runs on a
# worker thread, and ureq keeps the dependency tree small.
ureq = "2"
url = "2"

# Index
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
anyhow.workspace = true
tempfile = "3"
