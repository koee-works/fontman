[package]
name = "font-manager"
version = "0.2.0"
description = "Cross-platform font manager with face-level activation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "font_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
font-core = { path = "../crates/font-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
# Folder watching (inotify, FSEvents, ReadDirectoryChangesW).
notify = "8"
# Duplicate files go to the Trash / Recycle Bin, never deleted outright.
trash = "5"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The user's Google Fonts API key goes in the OS keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[features]
# Set by `tauri build`: serve the embedded frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
